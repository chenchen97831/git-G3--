  \
  - id: outline_generator\
    type: llm_agent\
    input: [cards/]\
    output: [outline.md]\
\
  - id: drafter\
    type: llm_agent\
    input: [outline.md, cards/]\
    output: [drafts/]\
    max_retries: 2 # \uc0\u31680 \u40670 \u20839 \u30340 \u23567  loop \u19978 \u38480 \u65306 \u26368 \u22810  2 \u36650 \
\
  - id: renderer\
    type: code_agent\
    input: [drafts/]\
    output: [deck.html, report.md]\
    max_retries: 3 # \uc0\u31680 \u40670 \u20839 \u30340 \u23567  loop \u19978 \u38480 \u65306 \u25130 \u22294 \u20462 \u29256 \u38754 \u26368 \u22810  3 \u36650 \
\
edges:\
